# golangci-lint v2 format — version key is REQUIRED
# Docs: https://golangci-lint.run/docs/configuration/file/
version: "2"

linters:
  # standard preset enables: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - misspell
  settings:
    errcheck:
      # Ignoring these is intentional and idiomatic for an offline CLI tool:
      #   fmt.Fprint*  — writing converted output / warnings to stdout/stderr
      #   fmt.Sscanf   — parsing a VSAN number already matched as \d+ by regexp
      #   (*os.File).Close — deferred close of files opened for read/write here
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Sscanf
        - (*os.File).Close

formatters:
  enable:
    - gofmt

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
